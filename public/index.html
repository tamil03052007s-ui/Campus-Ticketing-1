<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Passes | Upcoming events {{ORG_AT}}</title>
  <meta name="description" content="Find upcoming events {{ORG_AT}}, register in a minute and get a QR ticket by email.">
  <meta name="theme-color" content="#1b3c8c">
  <meta property="og:title" content="Campus Passes: upcoming events {{ORG_AT}}">
  <meta property="og:description" content="Register and get a QR ticket by email.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><span>Campus</span>Passes</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/" aria-current="page">Events</a>
      <a href="/organizer.html">Organizer</a>
    </nav>
  </header>

  <main class="wrap">
    <h1 class="page-title">Events {{ORG_AT}}</h1>
    <p id="summary" class="summary">Loading events…</p>

    <div class="filters" id="filters" hidden>
      <div class="search">
        <label class="visually-hidden" for="search">Search events</label>
        <input id="search" type="search" placeholder="Search by name, venue or topic" autocomplete="off">
      </div>
      <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
      <div class="filter-options">
        <label class="check"><input id="hide-full" type="checkbox"> Hide full events</label>
        <button id="clear" class="link-button" type="button" hidden>Clear filters</button>
      </div>
    </div>

    <div id="events" class="agenda" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <p>{{FOOTER}}</p>
  </footer>

  <script type="module" src="/js/events.js"></script>
</body>
</html>
